<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>PixelMart Control - Dashboard</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="container">
  <h1>PixelMart Control Dashboard</h1>
  <table id="shiftsTable">
    <thead>
      <tr>
        <th>Username</th>
        <th>Start Time (UTC)</th>
        <th>End Time (UTC)</th>
      </tr>
    </thead>
    <tbody></tbody>
  </table>
  <a href="index.html">Back to Shift Page</a>
</div>
<script>
const API_URL = "https://YOUR_BACKEND_URL"; // Replace with backend URL

async function loadShifts() {
    const res = await fetch(`${API_URL}/shifts`);
    const data = await res.json();
    const tbody = document.querySelector("#shiftsTable tbody");
    tbody.innerHTML = "";
    data.shifts.forEach(shift => {
        const row = document.createElement("tr");
        row.innerHTML = `<td>${shift.username}</td><td>${shift.start_time}</td><td>${shift.end_time ?? "ACTIVE"}</td>`;
        tbody.appendChild(row);
    });
}

// Refresh every 10 seconds
loadShifts();
setInterval(loadShifts, 10000);
</script>
</body>
</html>
